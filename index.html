/* Readable attendance grid and compact monthly totals. */
:root{--ink:#172d27;--muted:#4d6057;--line:#a8b7ae}
th{background:#dce8e0;color:#243d30;font-weight:700;font-size:12px}
th,td{border:1px solid #a8b7ae}
tr:last-child td{border-bottom:1px solid #a8b7ae}
table input,table select{border-color:#8d9e94;color:#172d27}
table input::placeholder{color:#64736a}
.saturday-row{background:#dfedff}.sunday-row{background:#ffe3e3}
.saturday-row td:first-child,.saturday{color:#154f9b;font-weight:700}
.sunday-row td:first-child,.sunday{color:#b22222;font-weight:700}
.saturday-row input,.saturday-row select{background:#f3f8ff}
.sunday-row input,.sunday-row select{background:#fff5f5}
.attendance-totals{display:flex;align-items:center;justify-content:flex-end;gap:24px;flex-wrap:wrap;padding:15px 20px;background:#edf2ed;border:1px solid #8b9d90;border-top:2px solid #718677;font-size:13px}
.attendance-totals>b{margin-right:auto}.attendance-totals strong{font-size:14px;margin:0 4px}
#printSheet{display:none}

@media screen and (max-width:720px){

.attendance-view .heading{flex-direction:row;align-items:center;flex-wrap:wrap}

 const records={...state.records};

  const k=key(i.date,r.employee),existing={...(records[k]??{start:'',end:'',break:timeDefaultsFor(r.employee,i.date).break,task:''})};
  if(r.kind==='paid'){

   existing.type=(next==='am'&&before==='pm')||(next==='pm'&&before==='am')?'paid':next;

  records[k]=existing;
 }

 if(!persist()){state.records=oldRecords;Object.assign(r,old);return false}render();toast('届出を承認し、出勤表に反映しました');return true;
}

function applyAnnualGrants(today=todayJST()){

 state.annualRule??={month:1,day:1,effectiveFrom:today,validYears:2};state.annualGrants??=[];
 const rule=annualRule(),added=[],year=Number(today.slice(0,4));

  if(grantMode(e)!=='manual'||!e.active||!e.leaveInitialized||!validDate(e.joinDate)||!Number.isFinite(e.annualDays)||e.annualDays<=0||!Number.isInteger(e.annualFirstYear))continue;

   if(!validDate(date)||date>today||date<rule.effectiveFrom||date<=e.leaveAsOf||date<e.joinDate||state.annualGrants.some(g=>g.cycle===cycle))continue;
   // Preserve manually registered lots and avoid an extra addition for their date.
   if(e.grants.some(g=>g.grantedOn===date))continue;
   const expiry=new Date(y+rule.validYears,rule.month-1,rule.day);expiry.setDate(expiry.getDate()-1);

function statutorySchedule(e,through=todayJST()){
 if(!validDate(e?.joinDate))return [];
 const history=(state.annualGrants??[]).filter(g=>g.employee===e.id),initial=history.find(g=>g.statutoryStep===0)?.grantedOn??addMonthsClamped(e.joinDate,6),rule=annualRule(),out=[{date:initial,step:0}];

  let year=Number(previous.slice(0,4));if(annualDate(year,rule)<=previous)year++;
  const common=annualDate(year,rule),deadline=addMonthsClamped(previous,12),proposed=common<deadline?common:deadline;

function clearAttendanceTimes(from,to,id=selected){
 const [a,b]=period();if(!validDate(from)||!validDate(to)||from>to||from<iso(a)||to>iso(b))throw Error('表示中の締め期間内で開始日・終了日を選んでください。');
 const targets=Object.entries(state.records).filter(([k,r])=>{const [who,date]=k.split(':');return Number(who)===id&&date>=from&&date<=to&&workingType(r.type)&&(r.start||r.end||Number(r.break)||r.nightBreak!=null)});
 if(lockedRequestDate(from,id)||lockedRequestDate(to,id)||targets.some(([k])=>lockedRequestDate(k.split(':')[1],id)))throw Error('提出済みの出勤表は変更できません。管理者に差し戻しを依頼してください。');

設<small>勤怠管理システム<\/small><\/span><\/a><div class=\"company\">スタンドアロン版<\/div><nav><a class=\"tsuru-link\" href=\"/app\">← 出勤表・有休・カレンダー<\/a><button data-tab=\"conditions\">社員別勤務条件<\/button><button data-tab=\"annual\">年間勤務カレンダー<\/button><button data-tab=\"overtime\">残業申請・実績<\/button><button data-tab=\"breaks\">休憩の詳細（任意）<\/button><button data-tab=\"alerts\">残業の通知<\/button><\/nav><div class=\"side-foot\" id=\"identity\"><\/div><\/aside>\n<div class=\"shell\"><header><span>鶴よし建設 ／ <b>勤務条件・設定<\/b><\/span><a class=\"button\" href=\"/app\">出勤表へ<\/a><\/header><main><div class=\"heading\"><div><div class=\"eyebrow\">TSURUYOSHI KINTAI<\/div><h1 id=\"pageTitle\">読み込み中…<\/h1><\/div><button id=\"refresh\">更新<\/button><\/div><div class=\"feature-toolbar\"><label>社員<select id=\"who\"><\/select><\/label><label>対象年<input id=\"year\" type=\"number\" min=\"2000\" max=\"2099\"><\/label><\/div><p class=\"feature-notice\">勤務制度を確認するまでは、法定時間外・割増賃金の確定計算は行いません。実働と所定時間超は承認の有無にかかわらず記録します。<\/p><p id=\"message\" role=\"status\" aria-live=\"polite\"><\/p><div id=\"featureApp\"><\/div><\/main><\/div><script>/*DEMO_SEARCH*/\n'use strict';\nconst q=s=>document.querySelector(s),escapeHTML=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]));\nconst day=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Tokyo'});\nlet me,model,base,tab='conditions',employeeId,dirty=false,resubmitId=null;\nconst modeName={unknown:'未確認',standard:'通常勤務（1日8h・週40h）','variable-month':'1か月単位の変形（26日〜翌月25日・予定確定が必要）','variable-year':'1年単位の変形（計算未設定）'};\nconst stateName={pending:'確認待ち',approved:'承認済み',returned:'差し戻し','detail-required':'詳細申請が必要',withdrawn:'取下げ（実績変更）'};\nconst h=v=>escapeHTML(v),hours=n=>n==null?'未確定':(n/60).toFixed(2)+'時間';\nconst embeddedSettings=new URLSearchParams((window.demoCompanySearch||'')).get('embedded')==='employee-settings';\nwindow.employeeSettingsDirty=()=>dirty;\nif(embeddedSettings){const style=document.createElement('style');style.textContent='body{background:#fff!important}body>aside,.shell>header,.practice-banner,main>.heading,.feature-toolbar,.feature-notice{display:none!important}.shell{margin:0!important}main{padding:0!important;max-width:none!important}.feature-panel{margin:0 0 14px!important;padding:16px!important}.feature-fields{grid-template-columns:repeat(2,minmax(0,1fr))!important}#featureApp>section+section{display:none!important}';document.head.append(style);}\nconst personalOnly=new URLSearchParams((window.demoCompanySearch||'')).get('self')==='1';\nconst admin=()=>me.user.role==='admin'&&!personalOnly;\nfunction message(text,error=false){q('#message').textContent=text;q('#message').classList.toggle('error',error);}\nasync function api(path,body){return structuredClone(parent.Demo.api(path,body));}\nasync function load(){const year=Number(q('#year').value);[model,base]=await Promise.all([api('/api/company?year='+year+'&date='+day),api('/api/state')]);const previous=employeeId;employeeId=model.employees.some(e=>e.id===previous)?previous:me.user.employee_id;q('#who').innerHTML=model.employees.map(e=>`<option value=\"${e.id}\" ${e.id===employeeId?'selected':''}>${h(e.code)} ${h(e.name)}${e.active?'':'（休止）'}<\/option>`).join('');dirty=false;draw();}\nasync function save(body){try{const r=await api('/api/company',body);dirty=false;resubmitId=null;await load();message(r.message);}catch(e){message(e.message,true);}}\nfunction bindForm(id,handler){q('#'+id).onsubmit=async e=>{e.preventDefault();const button=e.submitter;if(button)button.disabled=true;try{await handler();}catch(error){message(error.message,true);}finally{if(button)button.disabled=false;}};}\nfunction panel(title,content){return `<section class=\"panel feature-panel\"><h2>${h(title)}<\/h2>${content}<\/section>`;}\nfunction getCurrent(){return model.current[String(employeeId)];}\nfunction minute(t){if(!t)return NaN;const [a,b]=t.split(':').map(Number);return a*60+b;}\nfunction breakTable(id,rows){return `<div class=\"scroll\"><table class=\"feature-table\"><thead><tr><th>休憩開始<\/th><th>休憩終了<\/th><th><\/th><\/tr><\/thead><tbody id=\"${id}\">${rows.map(r=>breakRow(r)).join('')}<\/tbody><\/table><\/div>`;}\nfunction breakRow(r={start:'',end:''}){return `<tr><td><input type=\"time\" step=\"60\" data-break=\"start\" aria-label=\"休憩開始\" value=\"${h(r.start)}\"><\/td><td><input type=\"time\" step=\"60\" data-break=\"end\" aria-label=\"休憩終了\" value=\"${h(r.end)}\"><\/td><td><button type=\"button\" data-remove-break>削除<\/button><\/td><\/tr>`;}\nfunction readBreaks(id){return [...q('#'+id).children].map(row=>({start:row.querySelector('[data-break=\"start\"]').value,end:row.querySelector('[data-break=\"end\"]').value})).filter(r=>r.start||r.end);}\nfunction bindBreaks(id,button,update=()=>{}){q('#'+button).onclick=()=>{q('#'+id).insertAdjacentHTML('beforeend',breakRow());dirty=true;update();};q('#'+id).onclick=e=>{if(e.target.hasAttribute('data-remove-break')){e.target.closest('tr').remove();dirty=true;update();}};q('#'+id).addEventListener('input',update);}\nfunction employeeOptions(){return model.employees.map(e=>`<option value=\"${e.id}\" ${e.id===employeeId?'selected':''}>${h(e.name)}<\/option>`).join('');}\nfunction conditionScreen(){const current=getCurrent(),versions=model.conditions[String(employeeId)]||[],privateInfo=model.privateEmployees[String(employeeId)]||{};\nlet content=`<div class=\"feature-cards\"><div>始業〜終業<b>${h(current.start)}〜${h(current.end)}<\/b><\/div><div>所定実働<b>${h(hours(current.dailyMinutes))}<\/b><\/div><div>休憩合計<b>${current.breakMinutes}分<\/b><\/div><\/div><p>勤務制度：${h(modeName[current.mode])} ${current.unconfigured?'／個別条件は未登録です。':''}<\/p><p class=\"hint-text\">午前：${h(current.start)}〜${h(current.morningEnd)} ／ 午後：${h(current.afternoonStart)}〜${h(current.end)}。半日有休の所定時間もこの区切りで判定します。<\/p>`;\nif(admin()){const rows=current.breaks.length?current.breaks:current.breakMinutes===120?[{start:'10:00',end:'10:30'},{start:'12:00',end:'13:00'},{start:'15:00',end:'15:30'}]:current.breakMinutes===60?[{start:'12:00',end:'13:00'}]:[];\ncontent+=`<form id=\"conditionForm\"><h3>新しい適用期間の勤務条件<\/h3><div class=\"feature-fields\"><label>適用開始日<input id=\"conditionFrom\" type=\"date\" min=\"${day}\" value=\"${day}\" required><\/label><label>始業<input id=\"conditionStart\" type=\"time\" step=\"60\" value=\"${h(current.start)}\" required><\/label><label>終業<input id=\"conditionEnd\" type=\"time\" step=\"60\" value=\"${h(current.end)}\" required><\/label><label>勤務制度<select id=\"conditionMode\">${Object.entries(modeName).filter(([k])=>k!=='variable-month').map(([k,v])=>`<option value=\"${k}\" ${k===current.mode?'selected':''}>${h(v)}<\/option>`).join('')}<\/select><\/label><label>午前勤務の終了<input id=\"morningEnd\" type=\"time\" step=\"60\" value=\"${h(current.morningEnd)}\" required><\/label><label>午後勤務の開始<input id=\"afternoonStart\" type=\"time\" step=\"60\" value=\"${h(current.afternoonStart)}\" required><\/label><\/div><h3>所定の休憩時間帯<\/h3>${breakTable('conditionBreaks',rows)}<div class=\"feature-actions\"><button type=\"button\" id=\"addConditionBreak\">＋ 休憩時間帯<\/button><span id=\"conditionPreview\" class=\"readonly-value\"><\/span><\/div><p class=\"hint-text\">休憩候補は実際の勤務条件に合わせて修正してください。過去の条件は消さず、適用日ごとに保存します。残業通知は所定の実働時間を超えた分を集計します。勤務予定表の作成は不要です。<\/p><button class=\"primary\" type=\"submit\">勤務条件を保存<\/button><\/form>`;}\ncontent+=`<h3>勤務条件の履歴<\/h3><div class=\"scroll\"><table class=\"feature-table\"><thead><tr><th>適用開始<\/th><th>始業・終業<\/th><th>所定実働<\/th><th>休憩時間帯<\/th><th>制度<\/th><\/tr><\/thead><tbody>${versions.map(r=>`<tr><td>${h(r.from)}<\/td><td>${h(r.start)}〜${h(r.end)}<\/td><td>${hours(r.dailyMinutes)}<\/td><td>${r.breaks.map(b=>h(b.start)+'〜'+h(b.end)).join('<br>')}<\/td><td>${h(modeName[r.mode])}<\/td><\/tr>`).join('')||'<tr><td colspan=\"5\">個別条件はまだ登録されていません。<\/td><\/tr>'}<\/tbody><\/table><\/div>`;\nq('#featureApp').innerHTML=panel('社員別の勤務条件',content)+(admin()?panel('社員情報（管理者だけに表示）',`<form id=\"privateForm\"><div class=\"feature-fields\"><label>生年月日<input type=\ function companyAlertContent(result,user){
 const employees=result.employees.filter(e=>e.active!==false&&(user.role==='admin'||e.id===user.employee_id));
 if(user.role==='admin'){
  let over=0,near=0,missing=0;
  for(const e of employees){const a=result.alerts[String(e.id)];if(!a)continue;if(a.missingDates?.length)missing++;if(a.unconfirmed)continue;const levels=[a.monthLevel,a.yearLevel];if(levels.includes('over'))over++;else if(levels.includes('warning'))near++;}
  const parts=[];
  if(over||near)parts.push('<strong>残業通知：</strong>目安以上 '+over+'人・接近 '+near+'人 <a href="company.html?tab=alerts">一覧を見る</a>');
  if(missing)parts.push('勤務登録：未登録 '+missing+'人 <a href="index.html?screen=home">登録状況を見る</a>');
  return parts.length?'<div style="display:flex;align-items:center;flex-wrap:wrap;gap:4px 18px">'+parts.map(p=>'<span>'+p+'</span>').join('')+'</div>':'';
 }
 const messages=[];
 for(const e of employees){const a=result.alerts[String(e.id)];if(!a)continue;
  if(a.missingDates?.length)messages.push('前日までに未登録 '+a.missingDates.length+'日。残業時間は登録済み分の途中集計です。 <a href="index.html?screen=attendance">出勤表を確認</a>');
  if(!a.unconfirmed&&[a.monthLevel,a.yearLevel].some(x=>x==='warning'||x==='over'))messages.push('<strong>'+([a.monthLevel,a.yearLevel].includes('over')?'残業時間が目安に達しています':'残業時間が目安に近づいています')+'</strong> ／ 当月 '+(a.monthMinutes/60).toFixed(2)+'時間'+(a.monthLimit==null?'':'・目安 '+(a.monthLimit/60).toFixed(2)+'時間')+' <a href="company.html?tab=alerts">詳しく見る</a>');
 }
 return messages.join('<br>');
}
let companyAlertChecked=0;
async function companyAlerts(){
 if(Date.now()-companyAlertChecked<15000)return;companyAlertChecked=Date.now();
 try{const result=await serverApi('/api/company'),html=companyAlertContent(result,serverContext.user);let box=document.querySelector('#companyAlertBanner');
 if(!box){box=document.createElement('div');box.id='companyAlertBanner';box.className='info';box.style.cssText='border:1px solid #e2d5b8;border-radius:6px;background:#faf7ef;color:#655b46;font-size:12px;padding:6px 12px;margin:6px 28px;line-height:1.5';const main=document.querySelector('#app');main.before(box);
 const alignBanner=()=>{const css=getComputedStyle(main),parent=main.parentElement.getBoundingClientRect(),rect=main.getBoundingClientRect(),left=parseFloat(css.paddingLeft)||0,right=parseFloat(css.paddingRight)||0;box.style.width=Math.max(0,rect.width-left-right)+'px';box.style.marginLeft=(rect.left-parent.left+left)+'px';box.style.marginRight='0';};alignBanner();new ResizeObserver(alignBanner).observe(main);}
 box.hidden=!html;box.style.display=html?'block':'none';box.innerHTML=html;
 }catch{}
}

function startDemo(id){if(!demoGateUnlocked)return;Demo.setIdentity(id);window.serverContext={user:Demo.user(),state:Demo.read(),csrf:'demo'};serverBaseline=clone(serverContext.state);document.body.classList.remove('demo-locked');document.querySelector('#demoGate')?.remove();const script=document.createElement('script');script.textContent=document.querySelector('#demoAppSource').textContent;document.body.append(script);}
function gateText(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
let demoGateUnlocked=false;
async function checkDemoEntry(value){
 if(!globalThis.crypto?.subtle)throw Error('HTTPSの公開URLで開いてください。');
 const bytes=hex=>Uint8Array.from(hex.match(/../g),n=>parseInt(n,16));
 const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(value),{name:'PBKDF2'},false,['deriveBits']);
 const derived=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:bytes('bfe01ba25c6a4762a3a5db489f90cf1d'),iterations:210000,hash:'SHA-256'},key,256));
 const expected=bytes('3064e64531680632384fbb306f6530fe36bfc1e1fce3a5f3fb707dbf2a3e9830');let difference=derived.length^expected.length;for(let i=0;i<derived.length;i++)difference|=derived[i]^expected[i];return difference===0;
}
function showDemoGate(){document.body.classList.add('demo-locked');const gate=document.createElement('div');gate.id='demoGate';gate.innerHTML=`<form id="demoLogin"><p class="eyebrow">TSURUYOSHI KINTAI / 2026.10.23-P1</p><h1>鶴よし建設<br>勤怠管理 体験版</h1><p>パスワードを入力し、利用者を選んでください。</p><label>パスワード<input id="demoPassword" type="password" inputmode="numeric" autocomplete="off" required aria-label="体験版のパスワード"></label><label>利用者<select id="demoLoginUser">${Demo.read().employees.filter(e=>e.active).map(e=>`<option value="${e.id}">${e.role==='admin'?'管理者':'社員'}：${gateText(e.name)}</option>`).join('')}</select></label><p id="demoLoginError" role="alert"></p><button id="demoLoginButton" class="primary">体験版を開く →</button><small>架空の社員と有給20日のサンプルです。<br>実際の個人情報・勤怠は入力しないでください。<br>データはこのブラウザー内に保存され、端末間で共有されません。</small></form>`;document.body.append(gate);document.querySelector('#demoLogin').onsubmit=async e=>{
 e.preventDefault();const field=document.querySelector('#demoPassword'),button=document.querySelector('#demoLoginButton'),message=document.querySelector('#demoLoginError');button.disabled=true;message.textContent='確認しています…';
 try{const input=field.value;field.value='';if(!await checkDemoEntry(input)){message.textContent='パスワードを確認してください。';field.focus();return;}demoGateUnlocked=true;startDemo(Number(document.querySelector('#demoLoginUser').value));}catch(error){message.textContent=error.message||'開けませんでした。もう一度お試しください。';}finally{button.disabled=false;}
};}
function installBackups(){if(document.querySelector('#backupDemo'))return;const box=document.createElement('div');box.className='actions';box.innerHTML='<button id="backupDemo">バックアップ保存</button><button id="restoreDemo">バックアップ読込</button><input type="file" id="restoreFile" accept=".json,application/json" hidden>';document.querySelector('.header-right').append(box);
document.querySelector('#backupDemo').onclick=()=>{if(dirtyServer()&&!persist())return;const b=new Blob([JSON.stringify({format:'tsuruyoshi-browser-v2',version:'2026.10.23',state:Demo.read()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='tsuruyoshi-demo-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
document.querySelector('#restoreDemo').onclick=()=>document.querySelector('#restoreFile').click();document.querySelector('#restoreFile').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;if(file.size>10*1024*1024)throw Error('ファイルが大きすぎます。');const value=JSON.parse(await file.text()),s=value.state;if(value.format!=='tsuruyoshi-browser-v2'||!Array.isArray(s?.employees)||!s.employees.length||!s.records||!Array.isArray(s.requests)||!s.submissions||s.employees.some(x=>!Number.isInteger(x.id)||typeof x.name!=='string'||!['admin','employee'].includes(x.role)))throw Error('この体験版のバックアップを選んでください。');if(!confirm('現在の体験データをバックアップの内容に置き換えますか？'))return;Demo.commit(s);Demo.logout();location.reload();}catch(error){alert('読込みできませんでした：'+error.message);}finally{e.target.value='';}};}
showDemoGate();
